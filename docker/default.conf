# Bloco server{} da SPA (AD-8). Substitui só o conf.d/default.conf; o nginx.conf principal da
# imagem nginx-unprivileged fica intacto (pid e temporários em /tmp).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecionamentos relativos: atrás do Gateway a porta 8080 não pode vazar no Location.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Saúde do contêiner: 200 sem tocar disco nem API (CAP-7).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Gerado no start por /docker-entrypoint.d/40-config-json.sh (CAP-6).
    location = /config.json {
        alias /tmp/config/config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Arquivos com hash no nome (outputHashing: all), ex.: main-37T476F3.js, chunk-C-uibseo.js.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|svg|png|jpg|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rotas da SPA (deep link, ex.: /produtos/42) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
